<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Restricted</title>
<style>
html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d10;color:#e8e8e8;font:16px/1.6 system-ui,sans-serif}.card{width:min(720px,calc(100% - 40px));padding:38px;border:1px solid #00ffff;background:#11181c}h1{color:#00ffff}.meta{margin-top:22px;padding-top:18px;border-top:1px solid #2b373d;font-family:ui-monospace,monospace;color:#9caab0}
</style>
</head>
<body>
<main class="card">
<h1>Network Access Blocked</h1>
<p>{{REASON}}</p>
<div class="meta">Status: {{STATUS}}<br>IP: {{IP}}<br>Reference: {{BLOCK_ID}}<br>Expires: {{EXPIRES}}</div>
</main>
</body>
</html>
