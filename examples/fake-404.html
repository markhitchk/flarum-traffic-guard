<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>404 - Not Found</title>
<style>
html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f12;color:#e8e8e8;font:16px/1.55 system-ui,sans-serif}.box{width:min(680px,calc(100% - 40px));padding:40px;border:1px solid #00ffff;background:#11171b;box-shadow:0 18px 70px #0008}.code{font-size:64px;font-weight:900;color:#00ffff}code{color:#9ca9b0}
</style>
</head>
<body>
<main class="box">
<div class="code">{{STATUS}}</div>
<h1>Page not found</h1>
<p>The requested resource could not be served from this network.</p>
<p><code>Reference {{BLOCK_ID}}</code></p>
</main>
</body>
</html>
